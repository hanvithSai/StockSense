# Local, offline MongoDB (single-node replica set, required for transactions).
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017/stocksense?replicaSet=rs0
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports its status.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
